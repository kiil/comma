title: comma
description: Opinionated language overlay for yoke — a stateless toolbox of nushell commands for text.
remote_theme: just-the-docs/just-the-docs

# Site
url: https://kiil.github.io
baseurl: /comma

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Aux nav links
aux_links:
  GitHub:
    - https://github.com/kiil/comma

# Color scheme — supports dark
color_scheme: dark

# Footer
footer_content: 'Documentation follows the <a href="https://diataxis.fr/">Diátaxis framework</a>.'

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude from Jekyll build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - "*.gemspec"

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
